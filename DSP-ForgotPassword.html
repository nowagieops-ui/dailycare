<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSP App — Forgot Password — Daily Care Support</title>
<link rel="stylesheet" href="shared.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width:390px;height:844px;background:var(--ivory);display:flex;flex-direction:column">
  <div class="phone-header" style="border-bottom:none">
    <a href="DSP-Login.html" aria-label="Back to log in" class="btn-ghost" style="padding:6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:24px">
    <div class="stack gap-8">
      <h1 style="font-size:22px">Reset your password</h1>
      <p class="muted" style="font-size:14px;line-height:1.5">Enter the email or staff ID on your account and we'll send a link to reset your password.</p>
    </div>
    <div class="field">
      <label for="email">Staff ID or email</label>
      <input id="email" type="text" placeholder="jordan.m@dailycare.com">
    </div>
    <a href="DSP-Login.html" class="btn btn-primary btn-block">Send reset link</a>
    <a href="DSP-Login.html" style="font-size:13px;font-weight:600;text-align:center">Back to log in</a>
  </div>
</div>
<script src="nav.js?v=3"></script>
</body>
</html>
