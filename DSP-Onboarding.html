<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSP App — New Staff Onboarding — Daily Care Support</title>
<link rel="stylesheet" href="shared.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.step-dot.active{background:var(--teal-700);width:20px;border-radius:4px;}
</style>
</head>
<body>
<div style="width:390px;height:844px;background:var(--ivory);display:flex;flex-direction:column">
  <div class="phone-header" style="border-bottom:none">
    <a href="DSP-Login.html" aria-label="Back to log in" class="btn-ghost" style="padding:6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="row gap-6 center"><div class="step-dot active"></div><div class="step-dot"></div><div class="step-dot"></div></div>
  </div>
  <div class="phone-body" style="padding-top:12px">
    <div class="stack gap-6">
      <span class="eyebrow">Step 1 of 3 · Admin code</span>
      <h1 style="font-size:22px">New Staff Onboarding</h1>
      <p class="muted" style="font-size:14px;line-height:1.5">Enter the onboarding code your supervisor gave you, then set up your account.</p>
    </div>

    <div class="field">
      <label for="code">Admin onboarding code</label>
      <input id="code" type="text" placeholder="DCS-7F3K-9Q2L" style="font-family:monospace;letter-spacing:0.05em">
    </div>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" type="text" placeholder="Jordan Myers">
    </div>
    <div class="field">
      <label for="oemail">Email</label>
      <input id="oemail" type="email" placeholder="jordan.m@dailycare.com">
    </div>
    <div class="field">
      <label for="opw">Create password</label>
      <input id="opw" type="password" placeholder="••••••••">
    </div>
    <div class="field">
      <label for="opw2">Confirm password</label>
      <input id="opw2" type="password" placeholder="••••••••">
    </div>
    <label class="checkbox-row" style="font-size:13px;color:var(--ink-soft)">
      <input type="checkbox">
      <span>I agree to the Employee Handbook and confirm the information above is accurate.</span>
    </label>

    <a href="DSP-Login.html" class="btn btn-primary btn-block">Create account</a>
    <a href="DSP-Login.html" style="font-size:13px;font-weight:600;text-align:center">Already have an account? Log in</a>
  </div>
</div>
<script src="nav.js?v=3"></script>
</body>
</html>
