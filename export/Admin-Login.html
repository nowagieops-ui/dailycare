<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Log In — Daily Care Support</title>
<link rel="stylesheet" href="shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width:1280px;min-height:860px;display:flex">
  <div style="width:440px;flex-shrink:0;background:var(--teal-900);display:flex;flex-direction:column;justify-content:center;padding:56px;gap:18px">
    <div class="sidebar-brand-mark" style="width:44px;height:44px;border-radius:12px;font-size:18px">DC</div>
    <h1 style="color:#fff;font-size:26px;line-height:1.3">Daily Care Support<br>Admin Console</h1>
    <p style="color:#C9D0EE;font-size:14px;line-height:1.6;max-width:320px">Scheduling, staff &amp; client records, compliance documents, attendance, and reporting for your office team.</p>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--ivory);padding:40px">
    <div class="stack gap-20" style="width:360px">
      <div class="stack gap-6">
        <span class="eyebrow">Office Admin</span>
        <h2 style="font-size:24px">Welcome back</h2>
      </div>
      <div class="stack gap-16">
        <div class="field">
          <label for="aemail">Email</label>
          <input id="aemail" type="email" placeholder="pat.keller@dailycare.com">
        </div>
        <div class="field">
          <label for="apw">Password</label>
          <input id="apw" type="password" placeholder="••••••••">
        </div>
        <div class="row between">
          <label class="row gap-6 center" style="font-size:13px;color:var(--ink-soft)"><input type="checkbox" style="accent-color:var(--teal-700)"> Remember me</label>
          <a href="Admin-ForgotPassword.html" style="font-size:13px;font-weight:600">Forgot password?</a>
        </div>
      </div>
      <a href="Admin-Dashboard.html" class="btn btn-primary btn-block">Log In</a>
      <p class="faint" style="font-size:12px;text-align:center">Daily Care Support Admin Console · v1.0</p>
    </div>
  </div>
</div>
<script src="nav.js"></script>
</body>
</html>
