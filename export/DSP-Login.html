<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DSP App — Log In — Daily Care Support</title>
<link rel="stylesheet" href="shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width:390px;height:844px;background:var(--ivory);display:flex;flex-direction:column">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:28px">
    <div class="stack gap-10" style="align-items:center;text-align:center">
      <img src="assets/dsc-logo.png" alt="Daily Care Support" style="height:52px;width:auto">
      <span class="eyebrow">DSP Staff Portal</span>
    </div>
    <div class="stack gap-16">
      <div class="field">
        <label for="staffid">Staff ID or email</label>
        <input id="staffid" type="text" placeholder="jordan.m@dailycare.com">
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" placeholder="••••••••">
      </div>
      <div class="row between">
        <label class="row gap-6 center" style="font-size:13px;color:var(--ink-soft)"><input type="checkbox" style="accent-color:var(--teal-700)"> Remember me</label>
        <a href="DSP-ForgotPassword.html" style="font-size:13px;font-weight:600">Forgot password?</a>
      </div>
    </div>
    <div class="stack gap-12">
      <a href="DSP-Home.html" class="btn btn-primary btn-block">Log In</a>
      <div class="row center gap-8"><div style="flex:1;height:1px;background:var(--line)"></div><span class="faint" style="font-size:12px">OR</span><div style="flex:1;height:1px;background:var(--line)"></div></div>
      <a href="DSP-Onboarding.html" class="btn btn-secondary btn-block">New staff? Enter admin code</a>
    </div>
  </div>
  <div style="padding:16px;text-align:center" class="faint" style="font-size:12px">Daily Care Support DSP App · v1.0</div>
</div>
</body>
</html>
