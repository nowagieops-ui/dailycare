<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DSP App — Report Missed Clock-In — Daily Care Support</title>
<link rel="stylesheet" href="shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}
textarea{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);font-family:inherit;font-size:14px;resize:none;}
</style>
</head>
<body>
<div class="phone-screen" style="width:390px;height:844px">
  <div class="phone-header">
    <div class="row gap-12 center">
      <a href="DSP-ClockIn.html" aria-label="Back" class="btn-ghost" style="padding:6px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h2 style="font-size:18px">Missed Clock-In</h2>
    </div>
  </div>
  <div class="phone-body">
    <p class="muted" style="font-size:13px;line-height:1.5">Forgot to clock in or out? Let the office know so your hours can be corrected.</p>

    <div class="field">
      <label for="mc-client">Client / visit</label>
      <select id="mc-client">
        <option>Maria S. — Supported Living, Oct 24</option>
        <option>Maria S. — Supported Living, Oct 23</option>
        <option>Maria S. — Supported Living, Oct 21</option>
      </select>
    </div>
    <div class="row gap-12">
      <div class="field" style="flex:1">
        <label for="mc-in">Approx. clock in</label>
        <input id="mc-in" type="text" placeholder="9:00 AM">
      </div>
      <div class="field" style="flex:1">
        <label for="mc-out">Approx. clock out</label>
        <input id="mc-out" type="text" placeholder="1:00 PM">
      </div>
    </div>
    <div class="field">
      <label for="mc-reason">What happened?</label>
      <textarea id="mc-reason" rows="4" placeholder="e.g. Phone died during the visit, forgot to clock in on arrival."></textarea>
    </div>

    <a href="DSP-Home.html" class="btn btn-primary btn-block">Submit to office</a>
    <p class="faint" style="font-size:12px;text-align:center">Pat Keller will review and update your timesheet.</p>
  </div>
</div>
<script src="nav.js"></script>
</body>
</html>
