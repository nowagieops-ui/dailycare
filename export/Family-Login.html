<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family Portal — Log In — Daily Care Support</title>
<link rel="stylesheet" href="shared.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width:390px;height:844px;background:var(--ivory);display:flex;flex-direction:column">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:28px">
    <div class="stack gap-10" style="align-items:center;text-align:center">
      <img src="assets/dsc-logo.png" alt="Daily Care Support" style="height:52px;width:auto">
      <span class="eyebrow">Client &amp; Family Portal</span>
    </div>
    <div class="stack gap-16">
      <div class="field">
        <label for="femail">Email</label>
        <input id="femail" type="email" placeholder="thompson.family@email.com">
      </div>
      <div class="field">
        <label for="fpw">Password</label>
        <input id="fpw" type="password" placeholder="••••••••">
      </div>
      <div class="row between">
        <label class="row gap-6 center" style="font-size:13px;color:var(--ink-soft)"><input type="checkbox" style="accent-color:var(--teal-700)"> Remember me</label>
        <a href="Family-ForgotPassword.html" style="font-size:13px;font-weight:600">Forgot password?</a>
      </div>
    </div>
    <a href="Family-Home.html" class="btn btn-primary btn-block">Log In</a>
    <p class="muted" style="font-size:13px;text-align:center;line-height:1.5">New to the portal? Your case manager can send you an invite to get started.</p>
  </div>
  <div style="padding:16px;text-align:center" class="faint" style="font-size:12px">Daily Care Support · Family Portal v1.0</div>
</div>
<script src="nav.js?v=2"></script>
</body>
</html>
