<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Forgot Password — Daily Care Support</title>
<link rel="stylesheet" href="shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width:1280px;min-height:860px;display:flex">
  <div style="width:440px;flex-shrink:0;background:var(--teal-900);display:flex;flex-direction:column;justify-content:center;padding:56px;gap:18px">
    <div class="sidebar-brand-mark" style="width:44px;height:44px;border-radius:12px;font-size:18px">DC</div>
    <h1 style="color:#fff;font-size:26px;line-height:1.3">Daily Care Support<br>Admin Console</h1>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--ivory);padding:40px">
    <div class="stack gap-20" style="width:360px">
      <div class="stack gap-8">
        <h2 style="font-size:24px">Reset your password</h2>
        <p class="muted" style="font-size:14px;line-height:1.5">Enter your work email and we'll send a link to reset your password.</p>
      </div>
      <div class="field">
        <label for="raemail">Email</label>
        <input id="raemail" type="email" placeholder="pat.keller@dailycare.com">
      </div>
      <a href="Admin-Login.html" class="btn btn-primary btn-block">Send reset link</a>
      <a href="Admin-Login.html" style="font-size:13px;font-weight:600;text-align:center">Back to log in</a>
    </div>
  </div>
</div>
<script src="nav.js"></script>
</body>
</html>
