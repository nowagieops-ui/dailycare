<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSP App — Notifications — Daily Care Support</title>
<link rel="stylesheet" href="shared.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex-shrink:0;}
</style>
</head>
<body>
<div class="phone-screen" style="width:390px;height:844px">
  <div class="phone-header">
    <div class="row gap-12 center">
      <a href="DSP-Home.html" aria-label="Back to home" class="btn-ghost" style="padding:6px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h2 style="font-size:18px">Notifications</h2>
    </div>
    <button type="button" style="font-size:12px;font-weight:600;background:none;border:none;color:var(--teal-700);cursor:pointer;padding:0">Mark all read</button>
  </div>
  <div class="phone-body" style="gap:0;padding-top:4px">
    <a href="DSP-ClockIn.html" class="list-row" style="text-decoration:none;color:var(--ink)">
      <div class="unread-dot"></div>
      <div class="stack" style="flex:1;gap:2px">
        <span style="font-size:14px;font-weight:600">Your shift with Maria S. starts in 1 hour</span>
        <span class="faint" style="font-size:12px">8:00 AM</span>
      </div>
    </a>
    <a href="DSP-DocumentFill.html" class="list-row" style="text-decoration:none;color:var(--ink)">
      <div class="unread-dot"></div>
      <div class="stack" style="flex:1;gap:2px">
        <span style="font-size:14px;font-weight:600">Annual HIPAA Acknowledgment needs your signature</span>
        <span class="faint" style="font-size:12px">Today, 7:40 AM</span>
      </div>
    </a>
    <a href="DSP-Chat.html" class="list-row" style="text-decoration:none;color:var(--ink)">
      <div class="unread-dot"></div>
      <div class="stack" style="flex:1;gap:2px">
        <span style="font-size:14px;font-weight:600">New message from Pat Keller</span>
        <span class="faint" style="font-size:12px">Yesterday</span>
      </div>
    </a>
    <a href="DSP-Documents.html" class="list-row" style="text-decoration:none;color:var(--ink)">
      <div style="width:8px"></div>
      <div class="stack" style="flex:1;gap:2px">
        <span style="font-size:14px;font-weight:600">Medication Administration Training expires in 12 days</span>
        <span class="faint" style="font-size:12px">Mon</span>
      </div>
    </a>
    <a href="DSP-Schedule.html" class="list-row" style="text-decoration:none;color:var(--ink)">
      <div style="width:8px"></div>
      <div class="stack" style="flex:1;gap:2px">
        <span style="font-size:14px;font-weight:600">New shift added for Wed Oct 28</span>
        <span class="faint" style="font-size:12px">Fri</span>
      </div>
    </a>
  </div>
</div>
<script src="nav.js?v=3"></script>
</body>
</html>
